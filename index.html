<!DOCTYPE html>
<html>
<head>

<title>Mental Health Chatbot</title>

<style>

body{
font-family: Arial;
background:#f0f0f0;
text-align:center;
}

.container{
background:white;
width:500px;
margin:auto;
padding:20px;
margin-top:50px;
border-radius:10px;
}

input{
width:80%;
padding:10px;
}

button{
padding:10px;
background:green;
color:white;
border:none;
}

.step{
margin-top:20px;
text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h2>Mental Health Chatbot</h2>

<form method="POST">

<input type="text" name="message" placeholder="Type your message">

<button type="submit">Send</button>

</form>

{% if result %}

<div class="step">

<p><b>User Input:</b> {{result.input}}</p>

<p><b>Step 1:</b> Text Cleaned</p>

<p><b>Step 2:</b> Important Words → {{result.words}}</p>

<p><b>Step 3:</b> Emotion Detected → {{result.emotion}}</p>

<p><b>Step 4:</b> Response Generated</p>

<p><b>Bot Response:</b> {{result.response}}</p>

</div>

{% endif %}

</div>

</body>
</html>
